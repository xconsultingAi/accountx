# Serves the PWA and forwards the ERPNext API on the same origin.
#
# Why a proxy at all: a username + password login in ERPNext creates a session cookie with
# SameSite=Lax. Browsers do not send such a cookie on requests from another domain, so a
# PWA hosted anywhere other than the API's own origin could sign in but never stay signed
# in. Here the browser only ever talks to accounts.example.com; nginx relays /api to the
# SaaS site and the cookie lands on accounts.example.com.
#
# Replace accounts.example.com with your app's domain and inayatco.frappe.cloud with your
# ERPNext site (both places), then point root at the folder holding `npm run build` output.

server {
    listen 443 ssl http2;
    server_name accounts.example.com;

    ssl_certificate     /etc/letsencrypt/live/accounts.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/accounts.example.com/privkey.pem;

    root /var/www/accountx/dist;
    index index.html;

    # ERPNext API, uploaded files and PDFs.
    location ~ ^/(api|files|private)/ {
        proxy_pass https://inayatco.frappe.cloud;
        proxy_set_header Host inayatco.frappe.cloud;   # the SaaS routes sites by Host
        proxy_ssl_server_name on;                      # send SNI for the upstream TLS cert
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_cookie_domain inayatco.frappe.cloud accounts.example.com;
        proxy_read_timeout 120s;                       # ledgers over long periods take a while
        client_max_body_size 20m;
    }

    # The service worker must never be cached, or clients keep an old build forever.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location /static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Client-side routes (/receivable, /doc/...) all load the app.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    server_name accounts.example.com;
    return 301 https://$host$request_uri;
}
